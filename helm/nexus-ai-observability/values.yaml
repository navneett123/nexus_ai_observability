image:
  registry: ghcr.io/CHANGE_ME
  tag: latest
  pullPolicy: Always
replicas:
  dashboard: 1
  modelService: 1
  metricsService: 1
config:
  environmentName: Development
  appVersion: local
  octopusRelease: local
  kubernetesNamespace: nexus-ai-dev
  refreshInterval: "8"
  defaultModel: supportpilot
service:
  dashboardPort: 80
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 300m, memory: 256Mi}
