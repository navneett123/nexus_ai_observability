image:
  registry: navneet78
  # Empty means: use Chart.appVersion. CI sets Chart.appVersion to RELEASE_VERSION.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

replicas:
  dashboard: 1
  modelService: 1
  metricsService: 1

config:
  environmentName: Local
  deploymentRelease: local
  refreshInterval: "8"
  defaultModel: supportpilot

service:
  type: ClusterIP
  dashboardPort: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

probes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 12
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

ingress:
  enabled: false
  className: traefik
  annotations: {}
  host: nexus.local
  path: /
  pathType: Prefix
