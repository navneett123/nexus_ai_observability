{{- $root := . -}}
{{- $components := list
  (dict "name" "model-service" "port" 8001 "replicas" .Values.replicas.modelService "healthPath" "/health")
  (dict "name" "metrics-service" "port" 8002 "replicas" .Values.replicas.metricsService "healthPath" "/health")
  (dict "name" "dashboard" "port" 8000 "replicas" .Values.replicas.dashboard "healthPath" "/health")
-}}
{{- range $index, $component := $components }}
{{- if $index }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $component.name }}
  labels:
    {{- include "nexus.commonLabels" $root | nindent 4 }}
    {{- include "nexus.selectorLabels" (dict "component" $component.name "root" $root) | nindent 4 }}
spec:
  replicas: {{ $component.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "nexus.selectorLabels" (dict "component" $component.name "root" $root) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ printf "%s:%s:%s" $root.Values.config.environmentName $root.Values.config.refreshInterval $root.Values.config.defaultModel | sha256sum }}
        {{- with $root.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "nexus.selectorLabels" (dict "component" $component.name "root" $root) | nindent 8 }}
        app.kubernetes.io/version: {{ include "nexus.versionLabel" $root | quote }}
    spec:
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      {{- with $root.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $component.name }}
          image: "{{ $root.Values.image.registry }}/nexus-{{ $component.name }}:{{ include "nexus.imageTag" $root }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $root.Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $component.port }}
              protocol: TCP
          env:
            - name: APP_VERSION
              value: {{ include "nexus.imageTag" $root | quote }}
            {{- if eq $component.name "dashboard" }}
            - name: MODEL_SERVICE_URL
              value: "http://model-service:8001"
            - name: METRICS_SERVICE_URL
              value: "http://metrics-service:8002"
            - name: ENVIRONMENT_NAME
              value: {{ $root.Values.config.environmentName | quote }}
            - name: OCTOPUS_RELEASE
              value: {{ $root.Values.config.deploymentRelease | quote }}
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: REFRESH_INTERVAL
              value: {{ $root.Values.config.refreshInterval | quote }}
            - name: DEFAULT_MODEL
              value: {{ $root.Values.config.defaultModel | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ if eq $component.name "dashboard" }}/ready{{ else }}{{ $component.healthPath }}{{ end }}
              port: http
            {{- toYaml $root.Values.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ $component.healthPath }}
              port: http
            {{- toYaml $root.Values.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
