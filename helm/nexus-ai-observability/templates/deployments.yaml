apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-service
  labels:
    app.kubernetes.io/name: model-service
    app.kubernetes.io/part-of: nexus-ai-observability
    app.kubernetes.io/version: {{ .Values.image.tag | quote }}
spec:
  replicas: {{ .Values.replicas.modelService }}
  selector:
    matchLabels:
      app: model-service
  template:
    metadata:
      labels:
        app: model-service
        app.kubernetes.io/version: {{ .Values.image.tag | quote }}
    spec:
      containers:
        - name: model-service
          image: "{{ .Values.image.registry }}/nexus-model-service:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8001
          env:
            - name: APP_VERSION
              value: {{ .Values.config.appVersion | quote }}
          readinessProbe:
            httpGet: {path: /health, port: 8001}
            initialDelaySeconds: 4
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8001}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
