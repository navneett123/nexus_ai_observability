{{ toYaml .Values.resources | indent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: nexus-ai-observability
    app.kubernetes.io/version: {{ .Values.image.tag | quote }}
spec:
  replicas: {{ .Values.replicas.dashboard }}
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
        app.kubernetes.io/version: {{ .Values.image.tag | quote }}
    spec:
      containers:
        - name: dashboard
          image: "{{ .Values.image.registry }}/nexus-dashboard:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - {name: MODEL_SERVICE_URL, value: "http://model-service:8001"}
            - {name: METRICS_SERVICE_URL, value: "http://metrics-service:8002"}
            - name: ENVIRONMENT_NAME
              value: {{ .Values.config.environmentName | quote }}
            - name: APP_VERSION
              value: {{ .Values.config.appVersion | quote }}
            - name: OCTOPUS_RELEASE
              value: {{ .Values.config.octopusRelease | quote }}
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: REFRESH_INTERVAL
              value: {{ .Values.config.refreshInterval | quote }}
            - name: DEFAULT_MODEL
              value: {{ .Values.config.defaultModel | quote }}
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 8
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
