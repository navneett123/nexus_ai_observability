        - name: metrics-service
          image: "{{ .Values.image.registry }}/nexus-metrics-service:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8002
          env:
            - name: APP_VERSION
              value: {{ .Values.config.appVersion | quote }}
          readinessProbe:
            httpGet: {path: /health, port: 8002}
