apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus-dashboard
  namespace: nexus-dev
spec:
  ingressClassName: traefik
  rules:
    - host: nexus.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 80