services:
  model-service:
    image: ${REGISTRY_NAMESPACE:-navneet78}/nexus-model-service:${RELEASE_VERSION:-local}
    build:
      context: .
      dockerfile: services/model-service/Dockerfile
    environment:
      APP_VERSION: ${RELEASE_VERSION:-local}
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  metrics-service:
    image: ${REGISTRY_NAMESPACE:-navneet78}/nexus-metrics-service:${RELEASE_VERSION:-local}
    build:
      context: .
      dockerfile: services/metrics-service/Dockerfile
    environment:
      APP_VERSION: ${RELEASE_VERSION:-local}
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  dashboard:
    image: ${REGISTRY_NAMESPACE:-navneet78}/nexus-dashboard:${RELEASE_VERSION:-local}
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    ports:
      - "${DASHBOARD_PORT:-18000}:8000"
    environment:
      MODEL_SERVICE_URL: http://model-service:8001
      METRICS_SERVICE_URL: http://metrics-service:8002
      ENVIRONMENT_NAME: ${ENVIRONMENT_NAME:-Local}
      APP_VERSION: ${RELEASE_VERSION:-local}
      OCTOPUS_RELEASE: ${RELEASE_VERSION:-local}
      KUBERNETES_NAMESPACE: ${KUBERNETES_NAMESPACE:-local}
      REFRESH_INTERVAL: ${REFRESH_INTERVAL:-8}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-supportpilot}
    depends_on:
      model-service:
        condition: service_healthy
      metrics-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 12
