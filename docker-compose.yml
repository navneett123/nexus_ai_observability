services:
  model-service:
    image: ${REGISTRY_NAMESPACE}/nexus-model-service:${RELEASE_VERSION}
    build:
      context: .
      dockerfile: services/model-service/Dockerfile
    ports:
      - "8001:8001"

  metrics-service:
    image: ${REGISTRY_NAMESPACE}/nexus-metrics-service:${RELEASE_VERSION}
    build:
      context: .
      dockerfile: services/metrics-service/Dockerfile
    ports:
      - "8002:8002"

  dashboard:
    image: ${REGISTRY_NAMESPACE}/nexus-dashboard:${RELEASE_VERSION}
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    ports:
      - "8000:8000"
    environment:
      MODEL_SERVICE_URL: http://model-service:8001
      METRICS_SERVICE_URL: http://metrics-service:8002
      ENVIRONMENT_NAME: Local
      APP_VERSION: ${RELEASE_VERSION}
      OCTOPUS_RELEASE: ${RELEASE_VERSION}
      KUBERNETES_NAMESPACE: local
      REFRESH_INTERVAL: "8"
    depends_on:
      - model-service
      - metrics-service